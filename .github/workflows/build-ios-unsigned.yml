name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iosapp/**'
      - 'Sources/**'
      - 'Vendor/AI-Image-Classifier'
      - '.gitmodules'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/build_unsigned_ios.sh'
      - 'scripts/prepare_image_filter_models.sh'
      - 'scripts/collect_ios_build_diagnostics.sh'
      - '.github/workflows/build-ios-unsigned.yml'
  pull_request:
    paths:
      - 'iosapp/**'
      - 'Sources/**'
      - 'Vendor/AI-Image-Classifier'
      - '.gitmodules'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/build_unsigned_ios.sh'
      - 'scripts/prepare_image_filter_models.sh'
      - 'scripts/collect_ios_build_diagnostics.sh'
      - '.github/workflows/build-ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned classifier source
        run: |
          test "$(git -C Vendor/AI-Image-Classifier rev-parse HEAD)" = "5291eedb9b46fa978e36ccec4f5504b017afe809"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up model conversion Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Vendor/AI-Image-Classifier/tools/MobileCLIPConversion/requirements.txt

      - name: Cache SwiftPM and converted MobileCLIP
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
            .model-cache/mobileclip2-s2
            .model-cache/coreml-mobileclip2-s2
          key: ${{ runner.os }}-httrail-image-filter-${{ hashFiles('Package.resolved', 'Package.swift', 'Vendor/AI-Image-Classifier/tools/MobileCLIPConversion/**') }}
          restore-keys: |
            ${{ runner.os }}-httrail-image-filter-
            ${{ runner.os }}-swiftpm-

      - name: Prepare verified image-filter models
        shell: bash
        run: |
          chmod +x scripts/prepare_image_filter_models.sh
          scripts/prepare_image_filter_models.sh

      - name: Make scripts executable
        run: chmod +x scripts/build_unsigned_ios.sh scripts/collect_ios_build_diagnostics.sh

      - name: Build unsigned IPA
        id: build
        run: scripts/build_unsigned_ios.sh

      - name: Collect diagnostics
        if: always()
        run: scripts/collect_ios_build_diagnostics.sh

      - name: Verify embedded classifier products
        if: success()
        shell: bash
        run: |
          app="build/unsigned-ios/DerivedData/Build/Products/Release-iphoneos/HTTrailiOS.app"
          tunnel="$app/PlugIns/PacketTunnel.appex"
          test -d "$app/MobileCLIP2S2ImageEncoder.mlmodelc"
          test -d "$app/NudeNet320n.mlmodelc"
          test -s "$app/MobileCLIP2S2PromptEmbeddings.json"
          test -d "$tunnel/MobileCLIP2S2ImageEncoder.mlmodelc"
          test -d "$tunnel/NudeNet320n.mlmodelc"
          test -s "$tunnel/MobileCLIP2S2PromptEmbeddings.json"
          find "$app" -maxdepth 3 \( -name 'EmbeddedImageFilter.framework' -o -name 'ImageFilterCore.framework' \) -print

      - name: Verify unsigned IPA exists
        if: success()
        run: |
          test -s build/unsigned-ios/HTTrailiOS-unsigned.ipa
          shasum -a 256 build/unsigned-ios/HTTrailiOS-unsigned.ipa

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTTrail-unsigned-ipa-${{ github.run_number }}
          path: |
            build/unsigned-ios/HTTrailiOS-unsigned.ipa
            build/unsigned-ios/HTTrailiOS-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload app bundle and dSYMs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTTrail-ios-build-products-${{ github.run_number }}
          path: |
            build/unsigned-ios/DerivedData/Build/Products/Release-iphoneos/HTTrailiOS.app
            build/unsigned-ios/DerivedData/Build/Products/Release-iphoneos/*.dSYM
            build/unsigned-ios/DerivedData/Build/Products/Release-iphoneos/**/*.dSYM
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTTrail-ios-diagnostics-${{ github.run_number }}
          path: |
            build/unsigned-ios/logs
            build/unsigned-ios/diagnostics
            build/unsigned-ios/diagnostics.zip
            .model-cache/conversion-verification.json
          if-no-files-found: warn
          retention-days: 30
