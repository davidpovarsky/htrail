{
  "name": "PurelineRemote",
  "options": {
    "bundleIdPrefix": "com.davidpovarsky",
    "deploymentTarget": {
      "iOS": "26.5"
    },
    "createIntermediateGroups": true
  },
  "packages": {
    "HTTrail": {
      "path": ".."
    },
    "WireGuardKit": {
      "path": "../Packages/PurelineWireGuard"
    }
  },
  "aggregateTargets": {
    "WireGuardGoBridge": {
      "targets": [],
      "buildScripts": [
        {
          "name": "Build official WireGuard Go bridge",
          "script": "python3 \"$PROJECT_DIR/../scripts/build_wireguard_bridge.py\" --source-root \"$PROJECT_DIR/..\" --platform \"$PLATFORM_NAME\" --go \"$HOME/toolchains/go1.26.5/bin/go\" --minimum-ios \"$IPHONEOS_DEPLOYMENT_TARGET\" --output-root \"$PURELINE_WIREGUARD_BUILD_ROOT\" --jobs 2\n",
          "basedOnDependencyAnalysis": false
        }
      ],
      "settings": {
        "base": {
          "IPHONEOS_DEPLOYMENT_TARGET": "26.5",
          "PURELINE_WIREGUARD_BUILD_ROOT": "$(HOME)/caches/DerivedData/pureline-wireguard-20261127/WireGuard",
          "ENABLE_USER_SCRIPT_SANDBOXING": false
        }
      }
    }
  },
  "targets": {
    "ImageFilterCore": {
      "type": "framework",
      "platform": "iOS",
      "sources": [
        {
          "path": "ImageFilterIntegration/Core/PurelineFilterConfiguration.swift"
        }
      ],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "com.davidpovarsky.pureline.ImageFilterCore",
          "GENERATE_INFOPLIST_FILE": true,
          "MARKETING_VERSION": "1.0",
          "CURRENT_PROJECT_VERSION": "1",
          "SWIFT_VERSION": "6.0",
          "SWIFT_APPROACHABLE_CONCURRENCY": true,
          "SWIFT_DEFAULT_ACTOR_ISOLATION": "MainActor",
          "SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY": true,
          "IPHONEOS_DEPLOYMENT_TARGET": "26.5",
          "DEFINES_MODULE": true,
          "APPLICATION_EXTENSION_API_ONLY": true,
          "SWIFT_ACTIVE_COMPILATION_CONDITIONS": "$(inherited) PURELINE_REMOTE_BUILD"
        }
      }
    },
    "HTTrailiOS": {
      "type": "application",
      "platform": "iOS",
      "sources": [
        {
          "path": "Sources",
          "excludes": [
            "ImageFilterTabHostView.swift"
          ]
        },
        {
          "path": "WireGuardIntegration/App"
        },
        {
          "path": "WireGuardIntegration/Shared"
        },
        {
          "path": "PurelineIntegration",
          "excludes": [
            "ImageFiltering",
            "Configuration/PurelineFilterConfigurationViewModel.swift",
            "Configuration/PurelineConfigurationDocument.swift"
          ]
        },
        {
          "path": "../Resources/Fonts/JetBrainsMono.ttf",
          "buildPhase": "resources"
        },
        {
          "path": "../Resources/Localizations",
          "buildPhase": "resources"
        },
        {
          "path": "RemoteIntegration/App/ImageFilterTabHostView.swift"
        }
      ],
      "dependencies": [
        {
          "package": "WireGuardKit",
          "product": "WireGuardKit"
        },
        {
          "target": "WireGuardGoBridge"
        },
        {
          "package": "HTTrail",
          "product": "HTTrailCore"
        },
        {
          "target": "ImageFilterCore",
          "link": true,
          "embed": true
        },
        {
          "target": "PacketTunnel",
          "embed": true
        }
      ],
      "info": {
        "path": "RemoteIntegration/App/Info.plist",
        "properties": {
          "CFBundleDisplayName": "Pureline Remote",
          "CFBundleShortVersionString": "1.0",
          "CFBundleVersion": "$(CURRENT_PROJECT_VERSION)",
          "CFBundleLocalizations": [
            "en",
            "zh-Hans",
            "hi",
            "es",
            "ar",
            "fr",
            "bn",
            "pt-BR",
            "ru",
            "ur",
            "th"
          ],
          "ITSAppUsesNonExemptEncryption": false,
          "UIAppFonts": [
            "JetBrainsMono.ttf"
          ],
          "UIApplicationSceneManifest": {
            "UIApplicationSupportsMultipleScenes": true
          },
          "UILaunchScreen": {},
          "UISupportedInterfaceOrientations": [
            "UIInterfaceOrientationPortrait",
            "UIInterfaceOrientationLandscapeLeft",
            "UIInterfaceOrientationLandscapeRight"
          ],
          "UISupportedInterfaceOrientations~ipad": [
            "UIInterfaceOrientationPortrait",
            "UIInterfaceOrientationPortraitUpsideDown",
            "UIInterfaceOrientationLandscapeLeft",
            "UIInterfaceOrientationLandscapeRight"
          ],
          "NSLocalNetworkUsageDescription": "Pureline connects to the servers you select for API requests and remote filtering.",
          "NSAppTransportSecurity": {
            "NSAllowsArbitraryLoads": true
          },
          "UIFileSharingEnabled": true,
          "LSSupportsOpeningDocumentsInPlace": true,
          "PurelineBuildMode": "remote-wireguard"
        }
      },
      "entitlements": {
        "path": "RemoteIntegration/App/PurelineRemote.entitlements",
        "properties": {
          "com.apple.developer.networking.networkextension": [
            "packet-tunnel-provider"
          ],
          "com.apple.security.application-groups": [
            "group.com.davidpovarsky.pureline"
          ]
        }
      },
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "com.davidpovarsky.pureline",
          "DEVELOPMENT_TEAM": "NA6HPWARQ2",
          "CODE_SIGN_STYLE": "Automatic",
          "PROVISIONING_PROFILE_SPECIFIER": "$(HTTRAIL_APP_PROFILE_SPECIFIER)",
          "MARKETING_VERSION": "1.0",
          "CURRENT_PROJECT_VERSION": "8",
          "TARGETED_DEVICE_FAMILY": "1,2",
          "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
          "SWIFT_VERSION": "5.0",
          "LIBRARY_SEARCH_PATHS": "$(inherited) $(PURELINE_WIREGUARD_BUILD_ROOT)/$(PLATFORM_NAME)",
          "PURELINE_WIREGUARD_BUILD_ROOT": "$(HOME)/caches/DerivedData/pureline-wireguard-20261127/WireGuard",
          "IPHONEOS_DEPLOYMENT_TARGET": "26.5",
          "ENABLE_USER_SCRIPT_SANDBOXING": false,
          "PRODUCT_NAME": "PurelineRemote",
          "SWIFT_ACTIVE_COMPILATION_CONDITIONS": "$(inherited) PURELINE_REMOTE_BUILD"
        }
      },
      "postBuildScripts": [
        {
          "name": "Use Pureline Remote localized display name",
          "script": "set -eu\nresource_dir=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nfor strings in \"$resource_dir\"/*.lproj/InfoPlist.strings; do\n    [ -f \"$strings\" ] || continue\n    /usr/bin/plutil -replace CFBundleDisplayName -string \"Pureline Remote\" \"$strings\"\n    /usr/bin/plutil -replace CFBundleName -string \"Pureline Remote\" \"$strings\"\ndone\n",
          "basedOnDependencyAnalysis": false
        }
      ]
    },
    "PacketTunnel": {
      "type": "app-extension",
      "platform": "iOS",
      "sources": [
        {
          "path": "RemoteIntegration/Extension/PacketTunnelProvider.swift"
        },
        {
          "path": "WireGuardIntegration/Shared"
        },
        {
          "path": "WireGuardIntegration/Extension"
        }
      ],
      "dependencies": [
        {
          "package": "WireGuardKit",
          "product": "WireGuardKit"
        },
        {
          "target": "WireGuardGoBridge"
        }
      ],
      "info": {
        "path": "RemoteIntegration/Extension/Info.plist",
        "properties": {
          "CFBundleDisplayName": "Pureline Remote Tunnel",
          "CFBundleShortVersionString": "1.0",
          "CFBundleVersion": "$(CURRENT_PROJECT_VERSION)",
          "NSExtension": {
            "NSExtensionPointIdentifier": "com.apple.networkextension.packet-tunnel",
            "NSExtensionPrincipalClass": "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
          }
        }
      },
      "entitlements": {
        "path": "RemoteIntegration/Extension/PacketTunnel.entitlements",
        "properties": {
          "com.apple.developer.networking.networkextension": [
            "packet-tunnel-provider"
          ],
          "com.apple.security.application-groups": [
            "group.com.davidpovarsky.pureline"
          ]
        }
      },
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "com.davidpovarsky.pureline.PacketTunnel",
          "DEVELOPMENT_TEAM": "NA6HPWARQ2",
          "CODE_SIGN_STYLE": "Automatic",
          "PROVISIONING_PROFILE_SPECIFIER": "$(HTTRAIL_PACKET_TUNNEL_PROFILE_SPECIFIER)",
          "MARKETING_VERSION": "1.0",
          "CURRENT_PROJECT_VERSION": "8",
          "SWIFT_VERSION": "5.0",
          "LIBRARY_SEARCH_PATHS": "$(inherited) $(PURELINE_WIREGUARD_BUILD_ROOT)/$(PLATFORM_NAME)",
          "PURELINE_WIREGUARD_BUILD_ROOT": "$(HOME)/caches/DerivedData/pureline-wireguard-20261127/WireGuard",
          "IPHONEOS_DEPLOYMENT_TARGET": "26.5",
          "LD_RUNPATH_SEARCH_PATHS": "$(inherited) @executable_path/../../Frameworks",
          "ENABLE_USER_SCRIPT_SANDBOXING": false,
          "APPLICATION_EXTENSION_API_ONLY": true,
          "SWIFT_ACTIVE_COMPILATION_CONDITIONS": "$(inherited) PURELINE_REMOTE_BUILD"
        }
      }
    },
    "PurelineRemoteWireGuardUITests": {
      "type": "bundle.ui-testing",
      "platform": "iOS",
      "sources": [
        {
          "path": "WireGuardUITests"
        }
      ],
      "dependencies": [
        {
          "target": "HTTrailiOS"
        }
      ],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "com.davidpovarsky.pureline.RemoteWireGuardUITests",
          "GENERATE_INFOPLIST_FILE": true,
          "SWIFT_VERSION": "5.0",
          "IPHONEOS_DEPLOYMENT_TARGET": "26.5",
          "TEST_TARGET_NAME": "HTTrailiOS",
          "SWIFT_ACTIVE_COMPILATION_CONDITIONS": "$(inherited) PURELINE_REMOTE_BUILD"
        }
      }
    }
  },
  "schemes": {
    "PurelineRemote": {
      "build": {
        "targets": {
          "HTTrailiOS": "all"
        }
      },
      "run": {
        "config": "Debug"
      },
      "archive": {
        "config": "Release"
      }
    },
    "PurelineRemoteWireGuardUI": {
      "build": {
        "targets": {
          "HTTrailiOS": "all",
          "PurelineRemoteWireGuardUITests": [
            "test"
          ]
        }
      },
      "test": {
        "config": "Debug",
        "targets": [
          {
            "name": "PurelineRemoteWireGuardUITests",
            "parallelizable": false
          }
        ]
      }
    }
  }
}
